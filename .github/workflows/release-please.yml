name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag ya creado a (re)publicar, p. ej. v1.0.0 -- solo para reintentar un publish que falló"
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs['apps/server--release_created'] }}
      tag_name: ${{ steps.release.outputs['apps/server--tag_name'] }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: |
      always() &&
      ((github.event_name == 'push' && needs.release-please.outputs.release_created == 'true') ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm test

      # npm Trusted Publishing (OIDC): sin NODE_AUTH_TOKEN. El paquete debe tener
      # este repo+workflow configurado como Trusted Publisher en npmjs.com --
      # ver ADR-0019. npm >=11.5.1 (aquí 11.19.0) resuelve el intercambio OIDC
      # solo con el permiso id-token: write, sin ningún secret.
      - name: Publish to npm
        working-directory: apps/server
        run: npm publish --provenance
